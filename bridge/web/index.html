<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zero-bridge</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="shell">
  <aside id="sidebar">
    <button id="sidebar-toggle" type="button">Sessoes</button>
    <div id="sidebar-body">
      <label for="session-filter">Filtro</label>
      <select id="session-filter">
        <option value="workspace">workspace atual</option>
        <option value="all">todos</option>
      </select>
      <button id="refresh-sessions" type="button">Atualizar</button>
      <ul id="session-list"></ul>
      <button id="more-sessions" type="button" hidden>mais</button>
    </div>
  </aside>
  <main>
    <h1>zero-bridge</h1>
    <div id="login" hidden>
      <label for="token">Token</label>
      <input id="token" name="token" type="password" autocomplete="off">
      <button id="login-button" type="button">Entrar</button>
      <p id="login-error"></p>
    </div>
    <form id="session">
      <label for="workspace">Workspace</label>
      <input id="workspace" name="workspace" type="text" autocomplete="off" readonly>
      <button id="new-session" type="button">Nova sessao</button>
      <button id="logout" type="button" hidden>Sair</button>
      <section id="auth-sessions" hidden aria-labelledby="auth-sessions-title">
        <h2 id="auth-sessions-title">Sessoes deste acesso</h2>
        <p id="auth-sessions-status" role="status" aria-live="polite"></p>
        <ul id="auth-session-list" aria-label="Sessoes ativas"></ul>
        <button id="logout-all" type="button">Sair de todos os dispositivos</button>
      </section>
      <label for="mode">Mode</label>
      <select id="mode" disabled>
        <option value="auto">auto</option>
        <option value="ask">ask</option>
        <option value="plan">plan</option>
      </select>
    </form>
    <div id="plan" hidden></div>
    <div id="permissions"></div>
    <div id="log" aria-live="polite"></div>
    <form id="composer">
      <label for="text">Message</label>
      <textarea id="text" name="text" rows="3" required></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
