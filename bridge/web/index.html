<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zero-bridge</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="shell">
  <aside id="sidebar" aria-label="Sessões">
    <button id="sidebar-toggle" type="button" aria-expanded="false" aria-controls="sidebar-body">Sessões</button>
    <div id="sidebar-body">
      <div id="session-browser" hidden>
      <label for="session-filter">Filtro</label>
      <select id="session-filter">
        <option value="workspace">este diretório</option>
        <option value="all">todos</option>
      </select>
      <button id="refresh-sessions" type="button">Atualizar</button>
      <ul id="session-list"></ul>
      <p id="session-status" role="status"></p>
      <button id="session-retry" type="button" hidden>Tentar de novo</button>
      <button id="more-sessions" type="button" hidden>Mais</button>
      </div>
    </div>
  </aside>
  <main>
    <h1>zero-bridge</h1>
    <p id="agent-info" hidden></p>
    <form id="login" hidden>
      <label for="token">Token</label>
      <input id="token" name="token" type="password" autocomplete="off">
      <button id="login-button" type="submit">Entrar</button>
      <p id="login-error" role="alert"></p>
    </form>
    <form id="session">
      <label for="workspace">Diretório</label>
      <input id="workspace" name="workspace" type="text" autocomplete="off" readonly>
      <button id="new-session" type="button">Nova sessão</button>
      <button id="logout" type="button" hidden>Sair</button>
      <section id="auth-sessions" hidden aria-labelledby="auth-sessions-title">
        <h2 id="auth-sessions-title">Sessões deste acesso</h2>
        <p id="auth-sessions-status" role="status" aria-live="polite"></p>
        <ul id="auth-session-list" aria-label="Sessões ativas"></ul>
        <button id="logout-all" type="button">Sair de todos os dispositivos</button>
      </section>
      <label id="mode-label" for="mode" hidden>Modo</label>
      <select id="mode" hidden disabled></select>
    </form>
    <p id="status" class="sr-only" role="status"></p>
    <div id="plan" hidden aria-label="Plano"></div>
    <div id="permissions" aria-label="Permissões"></div>
    <div id="log" role="log" aria-live="off" aria-label="Conversa"></div>
    <form id="composer">
      <label for="text">Mensagem</label>
      <textarea id="text" name="text" rows="3" required></textarea>
      <button id="send" type="submit">Enviar</button>
    </form>
  </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
